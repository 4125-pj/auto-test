name: auto-test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env
          echo "API_USERNAME=${{ secrets.API_USERNAME }}" >> .env
          echo "API_PASSWORD=${{ secrets.API_PASSWORD }}" >> .env
          echo "UI_BASE_URL=${{ secrets.UI_BASE_URL }}" >> .env
          echo "UI_USERNAME=${{ secrets.UI_USERNAME }}" >> .env
          echo "UI_PASSWORD=${{ secrets.UI_PASSWORD }}" >> .env

      - name: Run API tests
        run: python -m pytest api/tests/ -v --no-header
